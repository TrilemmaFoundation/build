name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Confirm lockfile is stable
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund && git diff --exit-code -- package-lock.json

      - name: Validate and build
        run: npm run check:ci

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Install Chromium for interface checks
        run: npx playwright install --with-deps chromium

      - name: Browser route and accessibility checks
        run: npm run test:e2e -- --project=chromium
